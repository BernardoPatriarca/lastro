name: lastro
description: "Lastro: finanças pessoais offline, com crédito seguro."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/branding/2.0x/
    - assets/branding/3.0x/

  # Inter embutida: o app funciona 100% offline (sem google_fonts em runtime).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Splash nativo (gerado com: dart run flutter_native_splash:create).
flutter_native_splash:
  color: "#0F766E"
  image: assets/branding/splash.png
  android_12:
    color: "#0F766E"
    image: assets/branding/splash-android12.png
